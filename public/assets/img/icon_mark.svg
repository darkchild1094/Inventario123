<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC0000"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rnd">
      <rect x="0" y="0" width="200" height="200" rx="44" ry="44"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="44" ry="44" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect x="0" y="0" width="200" height="100" rx="0" ry="0" fill="url(#shine)" clip-path="url(#rnd)"/>

  <!-- Barcode top section -->
  <g fill="white">
    <rect x="38" y="26" width="5"  height="36" rx="2" opacity="0.95"/>
    <rect x="48" y="26" width="9"  height="36" rx="2" opacity="0.95"/>
    <rect x="62" y="26" width="4"  height="36" rx="2" opacity="0.95"/>
    <rect x="71" y="26" width="7"  height="36" rx="2" opacity="0.95"/>
    <rect x="83" y="26" width="5"  height="36" rx="2" opacity="0.95"/>
    <rect x="93" y="26" width="10" height="36" rx="2" opacity="0.95"/>
    <rect x="108" y="26" width="5"  height="36" rx="2" opacity="0.95"/>
    <rect x="118" y="26" width="8"  height="36" rx="2" opacity="0.95"/>
    <rect x="131" y="26" width="4"  height="36" rx="2" opacity="0.95"/>
    <rect x="140" y="26" width="7"  height="36" rx="2" opacity="0.95"/>
    <rect x="152" y="26" width="10" height="36" rx="2" opacity="0.95"/>
  </g>

  <!-- Yellow scan beam -->
  <rect x="20" y="62" width="160" height="4" rx="2" fill="#FFD100"/>
  <!-- Subtle second beam -->
  <rect x="20" y="68" width="160" height="1.5" rx="1" fill="#FFD100" opacity="0.4"/>

  <!-- Big bold 123 -->
  <text x="100" y="152"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="88"
        font-weight="900"
        fill="white"
        text-anchor="middle"
        letter-spacing="-3">123</text>

  <!-- Yellow bottom accent bar -->
  <rect x="38" y="163" width="124" height="7" rx="3.5" fill="#FFD100"/>

  <!-- Small "i" dot top-left — brand mark -->
  <circle cx="20" cy="26" r="6" fill="#FFD100" opacity="0.9"/>
</svg>